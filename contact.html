<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>
<body>
    <div class="heading">
		<h1>Contact us</h1>
	</div>

	<section class="contact" id="contact">
		<div class="icons-container">

			<div class="icons">
				<i class="fas fa-phone"></i>
				<h3>Contact number</h3>
				<p>+xx xxxxxxxxxx</p>
				<p>+xx xxxx xxx xxx</p>
			</div>

			<div class="icons">
				<i class="fas fa-envelope"></i>
				<h3>email</h3>
				<p>xxxxxxxxxxx@gmail.com</p>
				<p>xyzabc@gmail.com</p>
			</div>

			<div class="icons">
				<i class="fas fa-map-marker-alt"></i>
				<h3>address</h3>
				<p>India</p>
			</div>

		</div>
        </section>


		<div class="row">
			<form action="">
				<h3>get in touch</h3>
				<div class="inputBox">
					<input type="text"
						placeholder="enter your name" class="box">
					<input type="text"
						placeholder="enter your email" class="box">
				</div>
				<div class="inputBox">
					<input type="number"
						placeholder="enter your number" class="box">
					<input type="text"
						placeholder="enter your subject" class="box">
				</div>
				<textarea placeholder=" your message" cols="30"
						rows="10"></textarea>
				<input type="submit" v
					alue="send message" class="btn">
			</form>
		</div>

	</section>

<div class="box">
				<h3>newsletter</h3>
				<p>Dont miss any Offer</p>
				<form action="">
					<input type="email" placeholder="your e-mail">
					<input type="submit" value="subscribe" class="btn">
				</form>
			</div>
		</div>
	</section>
</body>
</html>
